<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d99ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0d99ff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="url(#pm-grad)" stroke-width="2.5"/>

  <!-- Subtle corner accent dot -->
  <circle cx="50" cy="14" r="3" fill="#0fa958" />

  <!-- PM Monogram -->
  <text x="32" y="42" 
        font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'Plus Jakarta Sans', Inter, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="-1px"
        text-anchor="middle" 
        fill="#ffffff"
        filter="url(#glow)">
    PM
  </text>
</svg>
